name: Flutter app

on:
  pull_request:
    paths:
      - "app/**"
      # The end-to-end job plays against the server.
      - "server/**"
      - ".github/workflows/app.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      # The end-to-end job plays against the server.
      - "server/**"
      - ".github/workflows/app.yml"

permissions:
  contents: read

# Actions are pinned to the commit their major tag pointed at, so a moved tag
# cannot change what runs here. Bump them on purpose, not by accident.
jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Must match the minimum in app/pubspec.yaml.
          - name: minimum 3.44.0
            flutter-version: 3.44.0
          - name: latest stable
            flutter-version: ""
            format: true
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}
          cache: true
      - run: flutter --version
      - run: flutter pub get
      # One formatter version is authoritative so the jobs cannot disagree.
      - if: matrix.format
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      # The server gates old installs on X-Client-Build, so the constant the
      # app sends has to be the build number the store actually ships.
      - name: clientBuild matches pubspec
        run: |
          pubspec="$(sed -n 's/^version: .*+//p' pubspec.yaml)"
          dart="$(sed -n 's/^const clientBuild = \([0-9]*\);/\1/p' lib/data/server.dart)"
          if [ "$pubspec" != "$dart" ]; then
            echo "pubspec build $pubspec != clientBuild $dart in lib/data/server.dart"
            exit 1
          fi
      - run: flutter test

  build:
    name: build ${{ matrix.platform }} (minimum 3.44.0)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            command: flutter build apk --debug
          - platform: ios
            os: macos-latest
            command: flutter build ios --simulator --debug
          # Release compiles catch what debug builds hide (AOT, R8, symbol
          # stripping, the device SDK). Unsigned: the upload key and Apple
          # certificates are not in CI; see README.md, "Release signing".
          - platform: android release
            os: ubuntu-latest
            command: flutter build appbundle --release
          - platform: ios release
            os: macos-latest
            command: flutter build ios --release --no-codesign
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: startsWith(matrix.platform, 'android')
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          # Must match the minimum in app/pubspec.yaml.
          flutter-version: 3.44.0
          cache: true
      - run: flutter pub get
      - run: ${{ matrix.command }}

  e2e:
    name: end-to-end against the server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Start the server
        working-directory: server
        run: |
          go build -o "$RUNNER_TEMP/imposter-server" ./cmd/server
          PORT=18080 "$RUNNER_TEMP/imposter-server" > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 50); do curl -sf localhost:18080/healthz && exit 0; sleep 0.2; done
          cat "$RUNNER_TEMP/server.log"
          exit 1
      - run: flutter pub get
        working-directory: app
      - run: flutter test test/e2e
        working-directory: app
        env:
          IMPOSTER_E2E_SERVER: http://localhost:18080
      - if: failure()
        run: cat "$RUNNER_TEMP/server.log"
