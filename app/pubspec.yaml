name: imposter_il
description: אפליקציית המשחק מי המתחזה?
publish_to: none
version: 0.1.0+4

# The Android and iOS runners use the Flutter 3.44 templates (UIScene
# lifecycle, Android Gradle Plugin 9). CI builds both on exactly 3.44.0 and
# tests on the latest stable release. The Dart language version stays at 3.6
# so the formatter style does not change.
environment:
  sdk: ^3.6.0
  flutter: ">=3.44.0"

dependencies:
  audioplayers: ^6.8.1
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.1
  intl: any
  share_plus: ^13.3.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  # UI text lives in lib/l10n/app_<language>.arb (docs/localization.md).
  generate: true
  assets:
    - assets/avatars/
    - assets/illustrations/
    # Mixkit Sound Effects Free License (assets/sounds/LICENSE.md).
    - assets/sounds/
  # Google Fonts under the SIL Open Font License (assets/fonts/OFL-*.txt).
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700
        - asset: assets/fonts/Rubik-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Rubik-Black.ttf
          weight: 900
    - family: Secular One
      fonts:
        - asset: assets/fonts/SecularOne-Regular.ttf

# App icon and splash: the Claude Design "Imposter IL Brand" page — the whole
# home illustration (home-hero) on the night-blue radial gradient, no text.
# branding/ holds the rendered sources. Regenerate with:
#   dart run flutter_launcher_icons && dart run flutter_native_splash:create
# Both tools also rewrite AndroidManifest.xml (dropping the portrait lock) and
# an Xcode build setting: restore those two files after running them.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: branding/icon.png
  # The gradient and the group are separate layers, framed for the full 108dp
  # (the launcher shows the middle 72dp), so no extra inset.
  adaptive_icon_background: branding/icon-background.png
  adaptive_icon_foreground: branding/icon-foreground.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  background_color_ios: "#14132B"

flutter_native_splash:
  # The illustration alone, 290pt wide, on the home screen's gradient.
  background_image: branding/splash-background.png
  image: branding/splash.png
  android_12:
    # Android 12+ draws the icon in a circle itself.
    color: "#14132B"
    image: branding/splash-android12.png
