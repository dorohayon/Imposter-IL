<style>
  #imposter-wireframes-v2 {
    --wf-page: light-dark(#f4f4f2, #191919);
    --wf-phone: light-dark(#ffffff, #242424);
    --wf-ink: light-dark(#202020, #f1f1ef);
    --wf-muted: light-dark(#666662, #aaa9a4);
    --wf-line: light-dark(#c9c9c4, #555550);
    --wf-fill: light-dark(#ececea, #343432);
    --wf-strong: light-dark(#2e2e2c, #e8e8e5);
    --wf-strong-ink: light-dark(#ffffff, #202020);
    --wf-danger: light-dark(#9f2f2f, #ffaaaa);
    direction: rtl;
    width: 100%;
    color: var(--wf-ink);
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }

  #imposter-wireframes-v2 * { box-sizing: border-box; }

  #imposter-wireframes-v2 .wf-toolbar {
    display: flex;
    align-items: end;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  #imposter-wireframes-v2 .wf-selector-label {
    display: grid;
    gap: 4px;
    min-width: min(100%, 280px);
  }

  #imposter-wireframes-v2 .wf-stage {
    display: grid;
    place-items: center;
    width: 100%;
  }

  #imposter-wireframes-v2 .wf-meta {
    width: min(100%, 375px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
    color: var(--wf-muted);
  }

  #imposter-wireframes-v2 .wf-phone {
    width: min(100%, 375px);
    min-height: 650px;
    padding: 16px;
    border: 2px solid var(--wf-line);
    border-radius: 28px;
    background: var(--wf-phone);
    color: var(--wf-ink);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  #imposter-wireframes-v2 .wf-header {
    min-height: 44px;
    display: grid;
    grid-template-columns: 44px 1fr 44px;
    align-items: center;
    gap: 8px;
  }

  #imposter-wireframes-v2 .wf-header-title {
    text-align: center;
    font-weight: 500;
  }

  #imposter-wireframes-v2 .wf-icon {
    width: 44px;
    height: 44px;
    border: 1px solid var(--wf-line);
    border-radius: 12px;
    background: transparent;
    color: var(--wf-ink);
    display: grid;
    place-items: center;
  }

  #imposter-wireframes-v2 .wf-body {
    display: flex;
    flex-direction: column;
    gap: 14px;
    flex: 1;
  }

  #imposter-wireframes-v2 .wf-center {
    text-align: center;
    align-items: center;
    justify-content: center;
  }

  #imposter-wireframes-v2 .wf-title {
    margin: 0;
    font-size: 27px;
    line-height: 1.2;
    font-weight: 500;
  }

  #imposter-wireframes-v2 .wf-subtitle,
  #imposter-wireframes-v2 .wf-note {
    margin: 0;
    color: var(--wf-muted);
  }

  #imposter-wireframes-v2 .wf-placeholder {
    width: 92px;
    height: 92px;
    border: 2px dashed var(--wf-line);
    border-radius: 24px;
    display: grid;
    place-items: center;
    color: var(--wf-muted);
  }

  #imposter-wireframes-v2 .wf-button {
    width: 100%;
    min-height: 50px;
    padding: 10px 14px;
    border: 1px solid var(--wf-line);
    border-radius: 13px;
    background: var(--wf-fill);
    color: var(--wf-ink);
    font: inherit;
    font-weight: 500;
    cursor: default;
  }

  #imposter-wireframes-v2 .wf-button-primary {
    border-color: var(--wf-strong);
    background: var(--wf-strong);
    color: var(--wf-strong-ink);
  }

  #imposter-wireframes-v2 .wf-button-ghost { background: transparent; }

  #imposter-wireframes-v2 .wf-actions {
    display: grid;
    gap: 10px;
    margin-top: auto;
  }

  #imposter-wireframes-v2 .wf-input {
    width: 100%;
    min-height: 48px;
    padding: 10px 12px;
    border: 1px solid var(--wf-line);
    border-radius: 10px;
    background: transparent;
    color: var(--wf-ink);
    font: inherit;
  }

  #imposter-wireframes-v2 .wf-field {
    display: grid;
    gap: 6px;
    text-align: right;
  }

  #imposter-wireframes-v2 .wf-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 9px;
  }

  #imposter-wireframes-v2 .wf-chip {
    min-height: 46px;
    padding: 8px;
    border: 1px solid var(--wf-line);
    border-radius: 10px;
    background: transparent;
    color: var(--wf-ink);
    font: inherit;
  }

  #imposter-wireframes-v2 .wf-chip-selected {
    border: 2px solid var(--wf-strong);
    background: var(--wf-fill);
    font-weight: 500;
  }

  #imposter-wireframes-v2 .wf-row {
    min-height: 48px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--wf-line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  #imposter-wireframes-v2 .wf-player {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  #imposter-wireframes-v2 .wf-avatar {
    width: 38px;
    height: 38px;
    flex: 0 0 auto;
    border: 1px solid var(--wf-line);
    border-radius: 50%;
    background: var(--wf-fill);
    display: grid;
    place-items: center;
  }

  #imposter-wireframes-v2 .wf-avatar-large {
    width: 66px;
    height: 66px;
  }

  #imposter-wireframes-v2 .wf-panel {
    padding: 14px;
    border: 1px solid var(--wf-line);
    border-radius: 12px;
    background: transparent;
  }

  #imposter-wireframes-v2 .wf-panel-strong {
    border: 2px solid var(--wf-strong);
  }

  #imposter-wireframes-v2 .wf-timer {
    min-width: 52px;
    font-size: 24px;
    font-weight: 500;
    text-align: center;
  }

  #imposter-wireframes-v2 .wf-timer-circle {
    width: 44px;
    height: 44px;
    border: 2px solid var(--wf-strong);
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-weight: 500;
  }

  #imposter-wireframes-v2 .wf-code {
    padding: 12px;
    border: 2px dashed var(--wf-line);
    border-radius: 10px;
    text-align: center;
    font-size: 25px;
    letter-spacing: 5px;
    direction: ltr;
  }

  #imposter-wireframes-v2 .wf-reactions {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
  }

  #imposter-wireframes-v2 .wf-reaction {
    min-width: 44px;
    min-height: 44px;
    padding: 8px 11px;
    border: 1px solid var(--wf-line);
    border-radius: 22px;
    background: transparent;
    color: var(--wf-ink);
    font: inherit;
  }

  #imposter-wireframes-v2 .wf-vote {
    width: 100%;
    text-align: right;
    border: 1px solid var(--wf-line);
    border-radius: 10px;
    background: transparent;
    color: var(--wf-ink);
    padding: 10px;
    font: inherit;
  }

  #imposter-wireframes-v2 .wf-vote-selected {
    border: 2px solid var(--wf-strong);
    background: var(--wf-fill);
  }

  #imposter-wireframes-v2 .wf-stat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  #imposter-wireframes-v2 .wf-stat {
    padding: 14px;
    border: 1px solid var(--wf-line);
    border-radius: 12px;
    text-align: center;
  }

  #imposter-wireframes-v2 .wf-stat strong {
    display: block;
    font-size: 26px;
    font-weight: 500;
  }

  #imposter-wireframes-v2 .wf-switch {
    width: 44px;
    height: 24px;
    border: 1px solid var(--wf-line);
    border-radius: 12px;
    background: var(--wf-fill);
    position: relative;
  }

  #imposter-wireframes-v2 .wf-switch::after {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    top: 2px;
    right: 3px;
    border-radius: 50%;
    background: var(--wf-strong);
  }

  #imposter-wireframes-v2 .wf-overlay {
    margin: auto 0;
    padding: 20px;
    border: 2px solid var(--wf-strong);
    border-radius: 14px;
    background: var(--wf-phone);
    text-align: center;
    display: grid;
    gap: 12px;
  }

  #imposter-wireframes-v2 .wf-danger { color: var(--wf-danger); }
  #imposter-wireframes-v2 .wf-auto-center { margin-inline: auto; }

  #imposter-wireframes-v2 .wf-dots {
    display: flex;
    justify-content: center;
    gap: 8px;
  }

  #imposter-wireframes-v2 .wf-dot {
    width: 12px;
    height: 12px;
    border: 1px solid var(--wf-line);
    border-radius: 50%;
    background: var(--wf-fill);
  }

  #imposter-wireframes-v2 .wf-dot-active { background: var(--wf-strong); }

  #imposter-wireframes-v2 .wf-inline-action {
    min-height: 36px;
    padding: 6px 10px;
    border: 1px solid var(--wf-line);
    border-radius: 9px;
    background: transparent;
    color: var(--wf-ink);
    font: inherit;
  }

  #imposter-wireframes-v2 .wf-error-box {
    padding: 10px 12px;
    border: 1px solid var(--wf-danger);
    border-radius: 10px;
    color: var(--wf-danger);
  }

  @media (max-width: 390px) {
    #imposter-wireframes-v2 .wf-phone { border-radius: 20px; padding: 13px; }
    #imposter-wireframes-v2 .wf-toolbar { align-items: stretch; }
    #imposter-wireframes-v2 .wf-selector-label { min-width: 100%; }
  }
</style>

    const root = document.getElementById('imposter-wireframes-v2');
    const phone = root.querySelector('#wf-phone');
    const select = root.querySelector('#wf-screen-select');
    const counter = root.querySelector('#wf-counter');
    const route = root.querySelector('#wf-route');
    const previous = root.querySelector('#wf-prev');
    const next = root.querySelector('#wf-next');
    let active = 0;

    screens.forEach((screen, index) => {
      const option = document.createElement('option');
      option.value = String(index);
      option.textContent = `${index + 1}. ${screen.name}`;
      select.appendChild(option);
    });

    function render() {
      const screen = screens[active];
      phone.innerHTML = screen.html;
      select.value = String(active);
      counter.textContent = `${active + 1} מתוך ${screens.length}`;
      route.textContent = screen.route;
      previous.disabled = active === 0;
      next.disabled = active === screens.length - 1;
      if (window.lucide) window.lucide.createIcons({ attrs: { width: 18, height: 18 } });
    }

    previous.addEventListener('click', () => {
      if (active > 0) active -= 1;
      render();
    });
    next.addEventListener('click', () => {
      if (active < screens.length - 1) active += 1;
      render();
    });
    select.addEventListener('change', () => {
      active = Number(select.value);
      render();
    });

    render();
  })();
