<style>
  #local-game-wireframes {
    --page: light-dark(#f4f4f2, #191919);
    --phone: light-dark(#fff, #242424);
    --ink: light-dark(#202020, #f1f1ef);
    --muted: light-dark(#666662, #aaa9a4);
    --line: light-dark(#c9c9c4, #555550);
    --fill: light-dark(#ececea, #343432);
    --strong: light-dark(#2e2e2c, #e8e8e5);
    --strong-ink: light-dark(#fff, #202020);
    --danger: light-dark(#9f2f2f, #ffaaaa);
    direction: rtl;
    width: 100%;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }

  #local-game-wireframes * { box-sizing: border-box; }
  #local-game-wireframes button,
  #local-game-wireframes input,
  #local-game-wireframes select { font: inherit; }

  #local-game-wireframes .toolbar {
    display: flex;
    align-items: end;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin: 0 auto 12px;
  }

  #local-game-wireframes .toolbar label { display: grid; gap: 4px; min-width: min(100%, 280px); }
  #local-game-wireframes .toolbar button,
  #local-game-wireframes .toolbar select {
    min-height: 42px;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--phone);
    color: var(--ink);
  }

  #local-game-wireframes .stage { display: grid; place-items: center; width: 100%; }
  #local-game-wireframes .meta {
    width: min(100%, 390px);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
    color: var(--muted);
  }

  #local-game-wireframes .phone {
    width: min(100%, 390px);
    min-height: 760px;
    padding: 18px;
    border: 2px solid var(--line);
    border-radius: 28px;
    background: var(--phone);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  #local-game-wireframes .header {
    min-height: 44px;
    display: grid;
    grid-template-columns: 44px 1fr 44px;
    align-items: center;
    gap: 8px;
  }

  #local-game-wireframes .header-title { text-align: center; font-weight: 650; }
  #local-game-wireframes .icon {
    width: 44px;
    height: 44px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: transparent;
    color: var(--ink);
  }

  #local-game-wireframes .body { display: flex; flex: 1; flex-direction: column; gap: 14px; }
  #local-game-wireframes .center { align-items: center; justify-content: center; text-align: center; }
  #local-game-wireframes h1 { margin: 0; font-size: 28px; line-height: 1.15; }
  #local-game-wireframes h2 { margin: 0; font-size: 20px; }
  #local-game-wireframes p { margin: 0; }
  #local-game-wireframes .muted { color: var(--muted); }
  #local-game-wireframes .danger { color: var(--danger); }

  #local-game-wireframes .illustration {
    width: 174px;
    min-height: 130px;
    padding: 12px;
    border: 2px dashed var(--line);
    border-radius: 24px;
    display: grid;
    place-items: center;
    color: var(--muted);
    text-align: center;
  }

  #local-game-wireframes .actions { display: grid; gap: 10px; margin-top: auto; width: 100%; }
  #local-game-wireframes .button {
    width: 100%;
    min-height: 52px;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 13px;
    background: var(--fill);
    color: var(--ink);
    font-weight: 650;
  }
  #local-game-wireframes .primary { border-color: var(--strong); background: var(--strong); color: var(--strong-ink); }
  #local-game-wireframes .ghost { background: transparent; }
  #local-game-wireframes .button[disabled] { opacity: .45; }

  #local-game-wireframes .card {
    width: 100%;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 14px;
    display: grid;
    gap: 8px;
  }
  #local-game-wireframes .card.selected { border: 2px solid var(--strong); background: var(--fill); }
  #local-game-wireframes .card-button { text-align: right; background: transparent; color: var(--ink); }
  #local-game-wireframes .option-title { font-size: 18px; font-weight: 700; }

  #local-game-wireframes .row {
    min-height: 52px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  #local-game-wireframes .player { display: flex; align-items: center; gap: 9px; min-width: 0; }
  #local-game-wireframes .avatar {
    width: 44px;
    height: 44px;
    flex: 0 0 auto;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: var(--fill);
    display: grid;
    place-items: center;
  }
  #local-game-wireframes .avatar.large { width: 74px; height: 74px; font-size: 24px; }
  #local-game-wireframes .spectator { opacity: .5; }

  #local-game-wireframes .field { display: grid; gap: 6px; text-align: right; width: 100%; }
  #local-game-wireframes .input {
    width: 100%;
    min-height: 48px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: transparent;
    color: var(--ink);
  }
  #local-game-wireframes .name-grid { display: grid; gap: 8px; }
  #local-game-wireframes .name-row { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; }

  #local-game-wireframes .stepper { display: grid; grid-template-columns: 48px 1fr 48px; gap: 8px; align-items: center; }
  #local-game-wireframes .stepper strong { text-align: center; font-size: 24px; }
  #local-game-wireframes .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  #local-game-wireframes .chip {
    min-height: 42px;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 21px;
    background: transparent;
    color: var(--ink);
  }
  #local-game-wireframes .chip.selected { border: 2px solid var(--strong); background: var(--fill); font-weight: 650; }

  #local-game-wireframes .timer {
    width: 50px;
    height: 50px;
    border: 3px solid var(--strong);
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-weight: 700;
  }
  #local-game-wireframes .timer.big { width: 116px; height: 116px; font-size: 38px; }
  #local-game-wireframes .progress { display: flex; justify-content: center; gap: 7px; }
  #local-game-wireframes .dot { width: 10px; height: 10px; border: 1px solid var(--line); border-radius: 50%; }
  #local-game-wireframes .dot.done { background: var(--strong); }

  #local-game-wireframes .secret {
    width: 100%;
    padding: 20px;
    border: 2px solid var(--strong);
    border-radius: 16px;
    font-size: 30px;
    font-weight: 750;
  }
  #local-game-wireframes .error { padding: 10px; border: 1px solid var(--danger); border-radius: 10px; color: var(--danger); }
  #local-game-wireframes .overlay { margin: auto 0; padding: 20px; border: 2px solid var(--strong); border-radius: 16px; display: grid; gap: 12px; text-align: center; }

  @media (max-width: 410px) {
    #local-game-wireframes .phone { min-height: 700px; padding: 14px; border-radius: 20px; }
    #local-game-wireframes .toolbar { align-items: stretch; }
    #local-game-wireframes .toolbar label { min-width: 100%; }
  }
</style>

<div id="local-game-wireframes">
  <div class="toolbar">

</div>

      html: `<div class="body center"><div class="illustration">result-impostor-win.webp</div><h1>המתחזה ניצח</h1><p class="muted">נשארו מתחזה ואזרח אחד</p><div class="card"><strong>המתחזה: מאיה</strong><span>המילה הייתה: פיצה</span><span>3 סבבים · 2 הודחו</span></div><p class="muted">משחק מקומי אינו משנה את הסטטיסטיקה</p><div class="actions"><button class="button primary">משחק נוסף</button><button class="button ghost">חזרה למסך הראשי</button></div></div>`
    },
    {
      name: 'אישור יציאה', route: '/local/exit',
      html: `<header class="header"><button class="icon">יציאה</button><div class="header-title">סיבוב 2</div><span></span></header><div class="body"><div class="overlay"><h1>לצאת מהמשחק?</h1><p class="muted">המשחק הנוכחי יימחק ולא יהיה אפשר להמשיך אותו.</p><button class="button danger">יציאה ומחיקה</button><button class="button primary">המשך משחק</button></div></div>`
    }
  ];

  const root = document.getElementById('local-game-wireframes');
  const phone = root.querySelector('#local-phone');
  const select = root.querySelector('#local-screen');
  const counter = root.querySelector('#local-counter');
  const route = root.querySelector('#local-route');
  const prev = root.querySelector('#local-prev');
  const next = root.querySelector('#local-next');
  let active = 0;

  screens.forEach((screen, index) => {
    const option = document.createElement('option');
    option.value = String(index);
    option.textContent = `${index + 1}. ${screen.name}`;
    select.appendChild(option);
  });

  function render() {
    const screen = screens[active];
    phone.innerHTML = screen.html;
    select.value = String(active);
    counter.textContent = `${active + 1} מתוך ${screens.length}`;
    route.textContent = screen.route;
    prev.disabled = active === 0;
    next.disabled = active === screens.length - 1;
  }

  prev.addEventListener('click', () => { if (active > 0) active -= 1; render(); });
  next.addEventListener('click', () => { if (active < screens.length - 1) active += 1; render(); });
  select.addEventListener('change', () => { active = Number(select.value); render(); });
  render();
})();
</script>
